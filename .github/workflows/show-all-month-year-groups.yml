name: Show all monthly and yearly transaction groups
on:
  push:
    paths:
      - '.github/workflows/show-all-month-year-groups.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove month and year pre-filtering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old=" const inActivityPeriod=(txDate:string)=>{if(activityPeriod==='daily'||activityPeriod==='custom')return txDate===activityDate;if(activityPeriod==='monthly')return txDate.slice(0,7)===activityDate.slice(0,7);return txDate.slice(0,4)===activityDate.slice(0,4)}"
          new=" const inActivityPeriod=(txDate:string)=>activityPeriod==='daily'||activityPeriod==='custom'?txDate===activityDate:true"
          assert old in s, 'activity period filter anchor missing'
          s=s.replace(old,new,1)
          assert "activityPeriod==='monthly'?renderMonthlyGroups()" in s
          assert "activityPeriod==='yearly'?renderYearlyGroups()" in s
          p.write_text(s)
          PY
          npm install --no-audit --no-fund
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Show all monthly and yearly transaction groups"
          git push
