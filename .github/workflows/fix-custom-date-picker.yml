name: Fix Home custom date picker

on:
  push:
    paths:
      - '.github/workflows/fix-custom-date-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Custom date picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()

          old=""" const openHomeCustomPicker=()=>{setHomePeriod('custom');setTimeout(()=>{const input=document.getElementById('home-custom-date') as HTMLInputElement|null;if(input?.showPicker)input.showPicker();else input?.click()},0)}\n"""
          if old in s:
              s=s.replace(old,'',1)

          old="""<div className=\"filters refFilters periodFilters homePeriodFilters\">{(['daily','monthly','yearly'] as InsightPeriod[]).map(p=><button key={p} className={homePeriod===p?'selected':''} onClick={()=>setHomePeriod(p)}>{p}</button>)}<button className={homePeriod==='custom'?'selected':''} onClick={openHomeCustomPicker}>custom</button><input id=\"home-custom-date\" className=\"homeCustomDateInput\" type=\"date\" value={homeDate} onChange={e=>{setHomeDate(e.target.value);setHomePeriod('custom')}} aria-label=\"Choose custom date\"/></div>"""
          new="""<div className=\"filters refFilters periodFilters homePeriodFilters\">{(['daily','monthly','yearly'] as InsightPeriod[]).map(p=><button key={p} className={homePeriod===p?'selected':''} onClick={()=>setHomePeriod(p)}>{p}</button>)}<label className={`customDateButton ${homePeriod==='custom'?'selected':''}`}>custom<input id=\"home-custom-date\" className=\"homeCustomDateInput\" type=\"date\" value={homeDate} onClick={()=>setHomePeriod('custom')} onChange={e=>{if(e.target.value)setHomeDate(e.target.value);setHomePeriod('custom')}} aria-label=\"Choose custom date\"/></label></div>"""
          assert old in s, 'custom date controls block not found'
          s=s.replace(old,new,1)
          p.write_text(s)

          css=Path('src/spenza-layout.css')
          c=css.read_text()
          oldcss='.homePeriodFilters{position:relative}.homeCustomDateInput{position:absolute;width:1px!important;height:1px!important;opacity:0;pointer-events:none;left:50%;bottom:0;padding:0!important;border:0!important}'
          newcss='.homePeriodFilters{position:relative}.customDateButton{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:9px!important;padding:7px 11px!important;border-radius:999px!important;background:var(--surface)!important;border:1px solid var(--line)!important;color:var(--muted)!important;font-weight:700;cursor:pointer;text-transform:capitalize}.customDateButton.selected{background:rgba(24,223,177,.14)!important;color:var(--accent)!important;border-color:rgba(24,223,177,.35)!important}.homeCustomDateInput{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;opacity:.001!important;cursor:pointer!important;padding:0!important;border:0!important;margin:0!important;pointer-events:auto!important}'
          if oldcss in c:
              c=c.replace(oldcss,newcss,1)
          else:
              c+='\n'+newcss+'\n'
          css.write_text(c)
          PY
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx src/spenza-layout.css
          git commit -m "Fix Custom date picker direct interaction"
          git push
