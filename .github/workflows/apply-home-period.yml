name: Apply Home account period controls

on:
  push:
    paths:
      - '.github/workflows/apply-home-period.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Home dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()

          old=""" const [insightPeriod,setInsightPeriod]=useState<InsightPeriod>('monthly')\n const [insightDate,setInsightDate]=useState(today())\n const [rateInput,setRateInput]=useState(String(defaultData.usdToLbpRate||89500))"""
          new=""" const [insightPeriod,setInsightPeriod]=useState<InsightPeriod>('monthly')\n const [insightDate,setInsightDate]=useState(today())\n const [homeWalletId,setHomeWalletId]=useState('')\n const [homePeriod,setHomePeriod]=useState<InsightPeriod>('monthly')\n const [homeDate,setHomeDate]=useState(today())\n const [rateInput,setRateInput]=useState(String(defaultData.usdToLbpRate||89500))"""
          assert old in s, 'state insertion point not found'
          s=s.replace(old,new,1)

          old=""" useEffect(()=>{if(!insightWalletId&&data.wallets[0])setInsightWalletId(data.wallets[0].id);if(insightWalletId&&!data.wallets.some(w=>w.id===insightWalletId))setInsightWalletId(data.wallets[0]?.id||'')},[data.wallets,insightWalletId])"""
          new=old+"\n useEffect(()=>{if(!homeWalletId&&data.wallets[0])setHomeWalletId(data.wallets[0].id);if(homeWalletId&&!data.wallets.some(w=>w.id===homeWalletId))setHomeWalletId(data.wallets[0]?.id||'')},[data.wallets,homeWalletId])"
          assert old in s, 'wallet effect insertion point not found'
          s=s.replace(old,new,1)

          start=s.index(" const monthKey=today().slice(0,7)")
          end=s.index(" const activityGroups=",start)
          replacement=""" const inHomePeriod=(txDate:string)=>{if(homePeriod==='daily')return txDate===homeDate;if(homePeriod==='monthly')return txDate.slice(0,7)===homeDate.slice(0,7);return txDate.slice(0,4)===homeDate.slice(0,4)}\n const shiftHomePeriod=(direction:number)=>{const d=new Date(`${homeDate}T12:00:00`);if(homePeriod==='daily')d.setDate(d.getDate()+direction);else if(homePeriod==='monthly')d.setMonth(d.getMonth()+direction);else d.setFullYear(d.getFullYear()+direction);setHomeDate(d.toISOString().slice(0,10))}\n const homePeriodLabel=homePeriod==='daily'?new Date(`${homeDate}T12:00:00`).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):homePeriod==='monthly'?new Date(`${homeDate.slice(0,7)}-01T12:00:00`).toLocaleDateString('en-US',{month:'long',year:'numeric'}):homeDate.slice(0,4)\n const homeWallet=data.wallets.find(w=>w.id===homeWalletId)||data.wallets[0]\n const homePeriodTx=homeWallet?data.transactions.filter(t=>(t.walletId===homeWallet.id||t.toWalletId===homeWallet.id)&&inHomePeriod(t.date)):[]\n const homeIncome=homePeriodTx.filter(t=>t.type==='income'&&t.walletId===homeWallet?.id).reduce((s,t)=>s+t.amount,0)\n const homeExpense=homePeriodTx.filter(t=>t.type==='expense'&&t.walletId===homeWallet?.id).reduce((s,t)=>s+t.amount,0)\n const homeTransferOut=homePeriodTx.filter(t=>t.type==='transfer'&&t.walletId===homeWallet?.id).reduce((s,t)=>s+t.amount,0)\n const homeTransferIn=homePeriodTx.filter(t=>t.type==='transfer'&&t.toWalletId===homeWallet?.id).reduce((s,t)=>s+(t.exchangeRate?t.amount*t.exchangeRate:t.amount),0)\n const homeNet=homeIncome-homeExpense-homeTransferOut+homeTransferIn\n const categoryTotals=data.categories.map(c=>({name:c,value:homePeriodTx.filter(t=>t.type==='expense'&&t.walletId===homeWallet?.id&&t.category===c).reduce((s,t)=>s+t.amount,0)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value)\n const categoryTotal=categoryTotals.reduce((s,x)=>s+x.value,0)\n let running=0\n const gradientParts=categoryTotals.slice(0,5).map((x,i)=>{const start=categoryTotal?running/categoryTotal*100:0;running+=x.value;const end=categoryTotal?running/categoryTotal*100:0;return `${palette[i%palette.length]} ${start}% ${end}%`})\n const donutBackground=gradientParts.length?`conic-gradient(${gradientParts.join(',')})`:'conic-gradient(var(--surface3) 0 100%)'\n"""
          s=s[:start]+replacement+s[end:]

          old="""   <section className=\"monthCard\"><button><ChevronLeft/></button><div><b>{monthLabel}</b><span>{homeWallet?`${homeWallet.name} balance`:'Your monthly overview'}</span><strong>{homeWallet?money(walletBalance(homeWallet.id),homeWallet.currency):'—'}</strong></div><button><ChevronRight/></button></section>\n   <div className=\"refSectionHead\"><h2>Accounts</h2><button onClick={()=>setTab('Wallets')}>See All</button></div>"""
          new="""   <div className=\"filters refFilters periodFilters\">{(['daily','monthly','yearly'] as InsightPeriod[]).map(p=><button key={p} className={homePeriod===p?'selected':''} onClick={()=>setHomePeriod(p)}>{p}</button>)}</div>\n   {data.wallets.length&&<div className=\"insightSelectors homeAccountSelector\"><label>Account<select value={homeWallet?.id||''} onChange={e=>setHomeWalletId(e.target.value)}>{data.wallets.map(w=><option key={w.id} value={w.id}>{w.name} ({w.currency})</option>)}</select></label></div>}\n   <section className=\"monthCard\"><button onClick={()=>shiftHomePeriod(-1)} aria-label=\"Previous period\"><ChevronLeft/></button><div><b>{homePeriodLabel}</b><span>{homeWallet?`${homeWallet.name} · ${homePeriod} net`:`${homePeriod} overview`}</span><strong>{homeWallet?money(homeNet,homeWallet.currency):'—'}</strong></div><button onClick={()=>shiftHomePeriod(1)} aria-label=\"Next period\"><ChevronRight/></button></section>\n   <div className=\"refSectionHead\"><h2>Accounts</h2><button onClick={()=>setTab('Wallets')}>See All</button></div>"""
          assert old in s, 'home card block not found'
          s=s.replace(old,new,1)

          old="""{data.wallets.slice(0,4).map((w,i)=><button className={`accountTile accountTone${i%4}`} key={w.id} onClick={()=>openWalletActivity(w.id)}><div><b>{w.name}</b><span>{w.currency}</span></div><strong>{money(walletBalance(w.id),w.currency)}</strong></button>)}"""
          new="""{data.wallets.slice(0,4).map((w,i)=><button className={`accountTile accountTone${i%4}${homeWallet?.id===w.id?' selectedAccount':''}`} key={w.id} onClick={()=>setHomeWalletId(w.id)}><div><b>{w.name}</b><span>{w.currency}</span></div><strong>{money(walletBalance(w.id),w.currency)}</strong></button>)}"""
          assert old in s, 'account rail block not found'
          s=s.replace(old,new,1)

          old="""<div className=\"refSectionHead\"><h2>{monthLabel.split(' ')[0]} Overview</h2><button onClick={()=>setTab('Insights')}>See All</button></div>"""
          new="""<div className=\"refSectionHead\"><h2>{homePeriodLabel} Overview</h2><button onClick={()=>{if(homeWallet)setInsightWalletId(homeWallet.id);setInsightPeriod(homePeriod);setInsightDate(homeDate);setTab('Insights')}}>See All</button></div>"""
          assert old in s, 'overview title not found'
          s=s.replace(old,new,1)

          old="""<div className=\"overviewGrid\"><article className=\"overviewIncome\"><span>Total Income</span><strong>{homeWallet?money(homeIncome,homeWallet.currency):'—'}</strong><small>{homeWallet?`${money(Math.max(homeIncome-homeExpense,0),homeWallet.currency)} left`:'Create a wallet first'}</small></article><article><span>Top Categories</span>"""
          new="""<div className=\"overviewGrid\"><article className=\"overviewIncome\"><span>Total Income</span><strong>{homeWallet?money(homeIncome,homeWallet.currency):'—'}</strong><small>{homeWallet?`Expenses ${money(homeExpense,homeWallet.currency)}`:'Create a wallet first'}</small></article><article><span>Top Categories</span>"""
          assert old in s, 'overview income block not found'
          s=s.replace(old,new,1)

          old="""{data.transactions.length?data.transactions.slice(0,4).map(t=><TxRow t={t} key={t.id}/>):<div className=\"empty compact\">No transactions yet.</div>}"""
          new="""{homePeriodTx.length?homePeriodTx.slice(0,4).map(t=><TxRow t={t} key={t.id}/>):<div className=\"empty compact\">No transactions for this account and period.</div>}"""
          assert old in s, 'recent transaction block not found'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Make Home dashboard account and period aware"
          git push
