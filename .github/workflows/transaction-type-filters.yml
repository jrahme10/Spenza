name: Transaction type filters
on:
  push:
    paths:
      - '.github/workflows/transaction-type-filters.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make transaction buttons filter the list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()

          state_anchor=" const [activityWalletId,setActivityWalletId]=useState<string|null>(null)"
          state_new=state_anchor+"\n const [activityTypeFilter,setActivityTypeFilter]=useState<'all'|TransactionType>('all')"
          assert state_anchor in s, 'activity state anchor not found'
          s=s.replace(state_anchor,state_new,1)

          old=" const activityTransactions=activityWalletId?data.transactions.filter(t=>t.walletId===activityWalletId||t.toWalletId===activityWalletId):data.transactions"
          new=" const activityTransactions=(activityWalletId?data.transactions.filter(t=>t.walletId===activityWalletId||t.toWalletId===activityWalletId):data.transactions).filter(t=>activityTypeFilter==='all'||t.type===activityTypeFilter).slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||'')))"
          assert old in s, 'activity transaction list anchor not found'
          s=s.replace(old,new,1)

          old_buttons="<div className=\"filters refFilters\"><button className={!activityWalletId?'selected':''} onClick={()=>setActivityWalletId(null)}>All</button><button onClick={()=>{resetForm();setType('income');setOpen(true)}}>Income</button><button onClick={()=>{resetForm();setType('expense');setOpen(true)}}>Expense</button><button onClick={()=>{resetForm();setType('transfer');setOpen(true)}}>Transfer</button></div>"
          new_buttons="<div className=\"filters refFilters\"><button className={activityTypeFilter==='all'?'selected':''} onClick={()=>setActivityTypeFilter('all')}>All</button><button className={activityTypeFilter==='income'?'selected':''} onClick={()=>setActivityTypeFilter('income')}>Income</button><button className={activityTypeFilter==='expense'?'selected':''} onClick={()=>setActivityTypeFilter('expense')}>Expense</button><button className={activityTypeFilter==='transfer'?'selected':''} onClick={()=>setActivityTypeFilter('transfer')}>Transfer</button></div>"
          assert old_buttons in s, 'activity filter buttons anchor not found'
          s=s.replace(old_buttons,new_buttons,1)

          p.write_text(s)
          PY
          npm ci
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Make transaction type buttons filter the list"
          git push
