name: Group transaction periods
on:
  push:
    paths:
      - '.github/workflows/group-transaction-periods.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add monthly and yearly expandable transaction groups
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          state_anchor=" const [activityCalendarOpen,setActivityCalendarOpen]=useState(false)"
          assert state_anchor in s, 'activity calendar state anchor missing'
          if 'collapsedActivityGroups' not in s:
              s=s.replace(state_anchor,state_anchor+"\n const [collapsedActivityGroups,setCollapsedActivityGroups]=useState<Set<string>>(()=>new Set())",1)
          old_groups=" const activityGroups=activityTransactions.reduce<Record<string,Transaction[]>>((acc,t)=>{(acc[t.date]??=[]).push(t);return acc},{})"
          assert old_groups in s, 'activity groups anchor missing'
          new_groups=" const activityGroups=activityTransactions.reduce<Record<string,Transaction[]>>((acc,t)=>{(acc[t.date]??=[]).push(t);return acc},{})\n const activityMonthGroups=activityTransactions.reduce<Record<string,Transaction[]>>((acc,t)=>{const key=t.date.slice(0,7);(acc[key]??=[]).push(t);return acc},{})\n const activityYearGroups=activityTransactions.reduce<Record<string,Record<string,Transaction[]>>>((years,t)=>{const year=t.date.slice(0,4);const month=t.date.slice(0,7);((years[year]??={})[month]??=[]).push(t);return years},{})\n const toggleActivityGroup=(key:string)=>setCollapsedActivityGroups(prev=>{const next=new Set(prev);if(next.has(key))next.delete(key);else next.add(key);return next})\n const monthLabel=(key:string)=>new Date(`${key}-01T12:00:00`).toLocaleDateString('en-US',{month:'long',year:'numeric'})\n const renderActivityRows=(items:Transaction[])=>items.map(t=><TxRow t={t} key={t.id}/>)\n const renderMonthlyGroups=()=>Object.entries(activityMonthGroups).map(([month,items])=>{const key=`month:${month}`;const open=!collapsedActivityGroups.has(key);return <section className=\"activityPeriodGroup monthGroup\" key={month}><button className=\"activityGroupHeader\" onClick={()=>toggleActivityGroup(key)} aria-expanded={open}><span><b>{monthLabel(month)}</b><small>{items.length} transaction{items.length===1?'':'s'}</small></span><ChevronRight className={open?'expanded':''}/></button><div className={`activityGroupBody ${open?'expanded':''}`}><div>{renderActivityRows(items)}</div></div></section>})\n const renderYearlyGroups=()=>Object.entries(activityYearGroups).map(([year,months])=>{const yearKey=`year:${year}`;const yearOpen=!collapsedActivityGroups.has(yearKey);return <section className=\"activityPeriodGroup yearGroup\" key={year}><button className=\"activityGroupHeader yearHeader\" onClick={()=>toggleActivityGroup(yearKey)} aria-expanded={yearOpen}><span><b>{year}</b><small>{Object.values(months).reduce((sum,items)=>sum+items.length,0)} transactions</small></span><ChevronRight className={yearOpen?'expanded':''}/></button><div className={`activityGroupBody ${yearOpen?'expanded':''}`}><div>{Object.entries(months).map(([month,items])=>{const monthKey=`year-month:${month}`;const monthOpen=!collapsedActivityGroups.has(monthKey);return <section className=\"nestedMonthGroup\" key={month}><button className=\"activityGroupHeader monthHeader\" onClick={()=>toggleActivityGroup(monthKey)} aria-expanded={monthOpen}><span><b>{new Date(`${month}-01T12:00:00`).toLocaleDateString('en-US',{month:'long'})}</b><small>{items.length} transaction{items.length===1?'':'s'}</small></span><ChevronRight className={monthOpen?'expanded':''}/></button><div className={`activityGroupBody ${monthOpen?'expanded':''}`}><div>{renderActivityRows(items)}</div></div></section>})}</div></div></section>})"
          s=s.replace(old_groups,new_groups,1)
          old_render='<div className="groupedTransactions">{Object.entries(activityGroups).map(([d,items])=><section key={d}><h3>{d===today()?\'Today\':new Date(`${d}T00:00:00`).toLocaleDateString(\'en-US\',{month:\'short\',day:\'numeric\',year:\'numeric\'})}</h3>{items.map(t=><TxRow t={t} key={t.id}/>)}</section>)}{!activityTransactions.length&&<div className="empty">No transactions yet.</div>}</div>'
          new_render='<div className="groupedTransactions">{activityPeriod===\'monthly\'?renderMonthlyGroups():activityPeriod===\'yearly\'?renderYearlyGroups():Object.entries(activityGroups).map(([d,items])=><section key={d}><h3>{d===today()?\'Today\':new Date(`${d}T00:00:00`).toLocaleDateString(\'en-US\',{month:\'short\',day:\'numeric\',year:\'numeric\'})}</h3>{items.map(t=><TxRow t={t} key={t.id}/>)}</section>)}{!activityTransactions.length&&<div className="empty">No transactions yet.</div>}</div>'
          assert old_render in s, 'activity render anchor missing'
          s=s.replace(old_render,new_render,1)
          p.write_text(s)
          css=Path('src/spenza-layout.css')
          cs=css.read_text()
          marker='/* expandable-transaction-period-groups */'
          if marker not in cs:
              cs += "\n/* expandable-transaction-period-groups */\n.activityPeriodGroup{margin:10px 0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}.activityPeriodGroup.yearGroup{margin-bottom:14px}.activityGroupHeader{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:var(--surface2);color:var(--text);padding:13px 14px;text-align:left}.activityGroupHeader span{display:flex;flex-direction:column;gap:2px}.activityGroupHeader b{font:inherit;font-weight:800;font-size:13px}.activityGroupHeader small{color:var(--muted);font-size:9px}.activityGroupHeader svg{width:16px;height:16px;transition:transform .24s ease}.activityGroupHeader svg.expanded{transform:rotate(90deg)}.activityGroupBody{display:grid;grid-template-rows:0fr;opacity:.65;transition:grid-template-rows .28s ease,opacity .2s ease}.activityGroupBody.expanded{grid-template-rows:1fr;opacity:1}.activityGroupBody>div{min-height:0;overflow:hidden}.nestedMonthGroup{border-top:1px solid var(--line)}.nestedMonthGroup:first-child{border-top:0}.monthHeader{padding-left:18px;background:var(--surface)}.yearHeader{background:linear-gradient(180deg,var(--surface2),var(--surface))}.activityGroupBody .tx{margin-left:10px;margin-right:10px}.activityGroupBody .tx:first-child{margin-top:8px}.activityGroupBody .tx:last-child{margin-bottom:10px}\n"
              css.write_text(cs)
          PY
          npm install --no-audit --no-fund
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx src/spenza-layout.css
          git commit -m "Group monthly and yearly transactions with expandable sections"
          git push
