name: Fix account deletion

on:
  push:
    paths:
      - '.github/workflows/fix-delete-account.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow deleting accounts with transactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old=""" const deleteWallet=(id:string)=>{const wallet=data.wallets.find(w=>w.id===id);if(!wallet)return;if(walletUsed(id)){setDialog({title:'Wallet is in use',message:'This wallet has transaction history. Reassign or delete those transactions before removing the wallet.',kind:'info'});return}setDialog({title:`Delete ${wallet.name}?`,message:'This wallet will be permanently removed from Spenza.',kind:'danger',confirmLabel:'Delete wallet',onConfirm:()=>setData(d=>({...d,wallets:d.wallets.filter(w=>w.id!==id)}))})}"""
          new=""" const deleteWallet=(id:string)=>{const wallet=data.wallets.find(w=>w.id===id);if(!wallet)return;const related=data.transactions.filter(t=>t.walletId===id||t.toWalletId===id);const count=related.length;setDialog({title:`Delete ${wallet.name}?`,message:count?`This account and ${count} related transaction${count===1?'':'s'} will be permanently deleted. This cannot be undone.`:'This account will be permanently removed from Spenza.',kind:'danger',confirmLabel:'Delete account',onConfirm:()=>{setData(d=>({...d,wallets:d.wallets.filter(w=>w.id!==id),transactions:d.transactions.filter(t=>t.walletId!==id&&t.toWalletId!==id)}));if(activityWalletId===id)setActivityWalletId(null);if(insightWalletId===id)setInsightWalletId('');if(homeWalletId===id)setHomeWalletId('');if(walletId===id)setWalletId('');if(toWalletId===id)setToWalletId('')}})}"""
          assert old in s, 'deleteWallet block not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Allow deleting accounts with related transactions"
          git push
