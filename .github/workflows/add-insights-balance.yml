name: Add Insights available balance
on:
  push:
    paths:
      - '.github/workflows/add-insights-balance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add available balance to Insights
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='''<div className="insightGrid refInsightGrid"><article><span>Expenses</span><strong>{money(insightExpenses,insightWallet.currency)}</strong></article><article><span>Income</span><strong>{money(insightIncome,insightWallet.currency)}</strong></article><article><span>Transactions</span><strong>{insightTransactions.length}</strong></article><article><span>Transfers Out</span><strong>{money(insightTransfers,insightWallet.currency)}</strong></article></div>'''
          new='''<div className="insightGrid refInsightGrid"><article><span>Available Balance</span><strong>{money(walletBalance(insightWallet.id),insightWallet.currency)}</strong></article><article><span>Expenses</span><strong>{money(insightExpenses,insightWallet.currency)}</strong></article><article><span>Income</span><strong>{money(insightIncome,insightWallet.currency)}</strong></article><article><span>Transactions</span><strong>{insightTransactions.length}</strong></article><article><span>Transfers Out</span><strong>{money(insightTransfers,insightWallet.currency)}</strong></article></div>'''
          assert old in s, 'Insights grid anchor not found'
          p.write_text(s.replace(old,new,1))
          PY
          npm ci
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Show available account balance in Insights"
          git push
