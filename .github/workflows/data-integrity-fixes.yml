name: Apply data integrity fixes
on:
  push:
    paths:
      - '.github/workflows/data-integrity-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integrity patch
        run: python3 .github/scripts/data_integrity_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx src/components/BackupManager.tsx src/components/BillsManager.tsx
          git commit -m "Harden local data integrity"
          git push
