name: Integrate App Lock and Notifications
on:
  push:
    paths:
      - '.github/workflows/integrate-lock-notifications.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Spenza integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          db=Path('src/lib/db.ts')
          s=db.read_text()
          old="export type SpenzaData = {\n  wallets: Wallet[]\n  transactions: Transaction[]\n  bills: Bill[]\n  categories: string[]\n  usdToLbpRate: number\n}"
          new="export type AppSecuritySettings = {\n  enabled: boolean\n  pinHash?: string\n  salt?: string\n  timeoutMinutes: number\n}\n\nexport type SpenzaData = {\n  wallets: Wallet[]\n  transactions: Transaction[]\n  bills: Bill[]\n  categories: string[]\n  usdToLbpRate: number\n  security: AppSecuritySettings\n  notificationReadIds: string[]\n  notificationDismissedIds: string[]\n}"
          assert old in s, 'SpenzaData shape not found'
          s=s.replace(old,new,1)
          old="  bills: [],\n  usdToLbpRate: DEFAULT_USD_TO_LBP_RATE,\n}"
          new="  bills: [],\n  usdToLbpRate: DEFAULT_USD_TO_LBP_RATE,\n  security: { enabled: false, timeoutMinutes: 0 },\n  notificationReadIds: [],\n  notificationDismissedIds: [],\n}"
          assert old in s, 'defaultData block not found'
          s=s.replace(old,new,1)
          old="        bills: stored?.bills ?? [],\n        usdToLbpRate: stored?.usdToLbpRate ?? DEFAULT_USD_TO_LBP_RATE,\n      })"
          new="        bills: stored?.bills ?? [],\n        usdToLbpRate: stored?.usdToLbpRate ?? DEFAULT_USD_TO_LBP_RATE,\n        security: stored?.security ?? { enabled: false, timeoutMinutes: 0 },\n        notificationReadIds: stored?.notificationReadIds ?? [],\n        notificationDismissedIds: stored?.notificationDismissedIds ?? [],\n      })"
          assert old in s, 'loadData block not found'
          db.write_text(s.replace(old,new,1))

          app=Path('src/App.tsx')
          s=app.read_text()
          anchor="import BillsManager from './components/BillsManager'"
          addition="import BillsManager from './components/BillsManager'\nimport SecuritySettings from './components/SecuritySettings'\nimport AppLockGate from './components/AppLockGate'\nimport NotificationCenter, { NotificationBell } from './components/NotificationCenter'"
          assert anchor in s, 'App import anchor not found'
          s=s.replace(anchor,addition,1)
          anchor=" const [noteImages,setNoteImages]=useState<string[]>([])"
          assert anchor in s, 'state anchor not found'
          s=s.replace(anchor,anchor+"\n const [notificationsOpen,setNotificationsOpen]=useState(false)",1)
          old='<header className="refHeader"><div><span className="eyebrow">SPENZA</span><h1>Good Morning! 👋</h1></div><button className="round" aria-label="Notifications"><Bell size={18}/></button></header>'
          new='<header className="refHeader"><div><span className="eyebrow">SPENZA</span><h1>Good Morning! 👋</h1></div><NotificationBell data={data} onClick={()=>setNotificationsOpen(true)}/></header>'
          assert old in s, 'Home notification bell not found'
          s=s.replace(old,new,1)
          old='<h3 className="settingsGroupTitle">Backup & Restore</h3><BackupManager/>'
          new='<h3 className="settingsGroupTitle">Security</h3><section className="settingsList"><SecuritySettings data={data} setData={setData}/></section><h3 className="settingsGroupTitle">Backup & Restore</h3><BackupManager/>'
          assert old in s, 'Settings backup anchor not found'
          s=s.replace(old,new,1)
          old='  {dialog&&<div className="dialogOverlay"'
          new='  <NotificationCenter data={data} setData={setData} open={notificationsOpen} onClose={()=>setNotificationsOpen(false)}/>\n  <AppLockGate data={data}/>\n  {dialog&&<div className="dialogOverlay"'
          assert old in s, 'dialog render anchor not found'
          app.write_text(s.replace(old,new,1))

          main=Path('src/main.tsx')
          s=main.read_text()
          anchor="import './mobile-safe.css'"
          assert anchor in s, 'main css anchor not found'
          if "import './security-notifications.css'" not in s:
              s=s.replace(anchor,anchor+"\nimport './security-notifications.css'",1)
          main.write_text(s)
          PY
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx src/lib/db.ts src/main.tsx
          git commit -m "Wire local app lock and notification center"
          git push
