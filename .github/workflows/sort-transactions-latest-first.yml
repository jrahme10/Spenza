name: Sort transactions latest first
on:
  push:
    paths:
      - '.github/workflows/sort-transactions-latest-first.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort transaction page newest first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          # Find the transaction-page filtered list and ensure its final ordering is date desc,
          # then createdAt/updatedAt desc for transactions sharing a date.
          anchors=['const filteredTransactions','const transactionRows','const visibleTransactions']
          pos=-1
          for a in anchors:
              pos=s.find(a)
              if pos>=0: break
          if pos<0:
              # broad fallback: insert helper and use it on grouped transaction source later
              helper="""\nconst newestTransactionFirst=(a:Transaction,b:Transaction)=>{const d=b.date.localeCompare(a.date);if(d)return d;return String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||''))}\n"""
              marker='export default function App'
              assert marker in s, 'App marker not found'
              s=s.replace(marker,helper+'\n'+marker,1)
              # Replace common grouped source sorting patterns.
              changed=False
              for old in ['.sort((a,b)=>a.date.localeCompare(b.date))','.sort((a,b)=>a.date.localeCompare(b.date)||String(a.createdAt||\'\').localeCompare(String(b.createdAt||\'\')))']:
                  if old in s:
                      s=s.replace(old,'.sort(newestTransactionFirst)')
                      changed=True
              if not changed:
                  raise SystemExit('Could not safely locate transaction ordering')
          else:
              # Limit replacement to nearby transaction list expression.
              end=s.find('\n  const ',pos+10)
              if end<0: end=min(len(s),pos+5000)
              chunk=s[pos:end]
              import re
              # Existing date sort ascending -> descending, with created timestamp tiebreaker.
              patterns=[
                (r'\.sort\(\(a,b\)=>a\.date\.localeCompare\(b\.date\)\)', ".sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||'')))"),
                (r'\.sort\(\(a, b\) => a\.date\.localeCompare\(b\.date\)\)', ".sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||'')))")
              ]
              newchunk=chunk
              for pat,repl in patterns:
                  newchunk,n=re.subn(pat,repl,newchunk,count=1)
                  if n: break
              if newchunk==chunk:
                  # If there is no explicit sort, append sort to a terminal filter chain before semicolon.
                  semi=chunk.find(';')
                  assert semi>0, 'Could not find end of transaction list expression'
                  expr=chunk[:semi]
                  if '.filter(' not in expr:
                      raise SystemExit('Could not safely add sorting')
                  newchunk=expr+".sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||'')))"+chunk[semi:]
              s=s[:pos]+newchunk+s[end:]
          p.write_text(s)
          PY
          npm ci
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Show latest transactions first"
          git push
