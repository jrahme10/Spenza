name: Add transaction search filters and summary
on:
  push:
    paths:
      - '.github/workflows/transaction-search-filters-summary.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add transaction search account category filters and totals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          state_anchor=" const [collapsedActivityGroups,setCollapsedActivityGroups]=useState<Set<string>>(()=>new Set())"
          assert state_anchor in s, 'activity group state anchor missing'
          if 'activitySearch,setActivitySearch' not in s:
              state_add=state_anchor+"\n const [activitySearch,setActivitySearch]=useState('')\n const [activityAccountFilter,setActivityAccountFilter]=useState(()=>localStorage.getItem('spenza-activity-account')||'all')\n const [activityCategoryFilter,setActivityCategoryFilter]=useState(()=>localStorage.getItem('spenza-activity-category')||'all')"
              s=s.replace(state_anchor,state_add,1)
          effect_anchor=" useEffect(()=>{localStorage.setItem('spenza-activity-type',activityTypeFilter)},[activityTypeFilter])"
          assert effect_anchor in s, 'activity type persistence effect anchor missing'
          if "localStorage.setItem('spenza-activity-account'" not in s:
              effect_add=effect_anchor+"\n useEffect(()=>{localStorage.setItem('spenza-activity-account',activityAccountFilter)},[activityAccountFilter])\n useEffect(()=>{localStorage.setItem('spenza-activity-category',activityCategoryFilter)},[activityCategoryFilter])"
              s=s.replace(effect_anchor,effect_add,1)
          old=" const activityTransactions=(activityWalletId?data.transactions.filter(t=>t.walletId===activityWalletId||t.toWalletId===activityWalletId):data.transactions).filter(t=>(activityTypeFilter==='all'||t.type===activityTypeFilter)&&inActivityPeriod(t.date)).slice().sort(newestTransactionFirst)"
          assert old in s, 'activity transactions anchor missing'
          new=(" const activitySearchNormalized=activitySearch.trim().toLowerCase()\n"
               " const activityTransactions=(activityWalletId?data.transactions.filter(t=>t.walletId===activityWalletId||t.toWalletId===activityWalletId):data.transactions).filter(t=>{const wallet=data.wallets.find(w=>w.id===t.walletId);const toWallet=data.wallets.find(w=>w.id===t.toWalletId);const matchesSearch=!activitySearchNormalized||[t.title,t.category,t.note,wallet?.name,toWallet?.name,String(t.amount)].some(v=>String(v||'').toLowerCase().includes(activitySearchNormalized));const matchesAccount=activityAccountFilter==='all'||t.walletId===activityAccountFilter||t.toWalletId===activityAccountFilter;const matchesCategory=activityCategoryFilter==='all'||t.category===activityCategoryFilter;return (activityTypeFilter==='all'||t.type===activityTypeFilter)&&inActivityPeriod(t.date)&&matchesAccount&&matchesCategory&&matchesSearch}).slice().sort(newestTransactionFirst)\n"
               " const activityDisplayCurrency=(activityAccountFilter!=='all'?data.wallets.find(w=>w.id===activityAccountFilter):activityWallet)?.currency\n"
               " const activityIncome=activityTransactions.filter(t=>t.type==='income').reduce((sum,t)=>sum+t.amount,0)\n"
               " const activityExpense=activityTransactions.filter(t=>t.type==='expense').reduce((sum,t)=>sum+t.amount,0)\n"
               " const activityNet=activityIncome-activityExpense")
          s=s.replace(old,new,1)
          start=s.find("  {tab==='Activity'&&<section className=\"page refPage\">")
          end=s.find("  {tab==='Wallets'&&",start)
          assert start>=0 and end>start, 'Activity screen block not found'
          block=s[start:end]
          marker='<div className="filters refFilters"><button className={activityTypeFilter===\'all\'?\'selected\':\'\'}'
          assert marker in block, 'type filter marker missing'
          insert='<div className="activityAdvancedFilters"><label className="activitySearch"><Search size={14}/><input value={activitySearch} onChange={e=>setActivitySearch(e.target.value)} placeholder="Search transactions" inputMode="search"/></label><div className="activitySelectFilters"><label><span>Account</span><select value={activityAccountFilter} onChange={e=>setActivityAccountFilter(e.target.value)}><option value="all">All accounts</option>{data.wallets.map(w=><option key={w.id} value={w.id}>{w.name} ({w.currency})</option>)}</select></label><label><span>Category</span><select value={activityCategoryFilter} onChange={e=>setActivityCategoryFilter(e.target.value)}><option value="all">All categories</option>{data.categories.map(c=><option key={c} value={c}>{c}</option>)}</select></label></div></div><div className="activitySummary"><article><span>Income</span><strong>{activityDisplayCurrency?money(activityIncome,activityDisplayCurrency):activityIncome.toLocaleString()}</strong></article><article><span>Expense</span><strong>{activityDisplayCurrency?money(activityExpense,activityDisplayCurrency):activityExpense.toLocaleString()}</strong></article><article><span>Net</span><strong className={activityNet>=0?\'positive\':\'\'}>{activityDisplayCurrency?money(activityNet,activityDisplayCurrency):activityNet.toLocaleString()}</strong></article></div>'
          block=block.replace(marker,insert+marker,1)
          s=s[:start]+block+s[end:]
          if ' Search,' not in s.split('\n')[1] and ', Search ' not in s.split('\n')[1]:
              s=s.replace('CalendarClock, Check','CalendarClock, Search, Check',1)
          p.write_text(s)
          css=Path('src/spenza-layout.css')
          cs=css.read_text()
          if '/* transaction-search-filters-summary */' not in cs:
              cs += "\n/* transaction-search-filters-summary */\n.activityAdvancedFilters{display:grid;gap:9px;margin:10px 0 8px}.activitySearch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:44px}.activitySearch svg{color:var(--muted);flex:0 0 auto}.activitySearch input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:12px;min-width:0}.activitySearch input::placeholder{color:var(--muted)}.activitySelectFilters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.activitySelectFilters label{display:grid;gap:4px}.activitySelectFilters span{font-size:9px;color:var(--muted);padding-left:3px}.activitySelectFilters select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:11px;padding:0 10px}.activitySummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0 11px}.activitySummary article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 9px;min-width:0}.activitySummary span{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.activitySummary strong{display:block;color:var(--text);font-size:11px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activitySummary strong.positive{color:var(--positive,#159957)}@media(max-width:360px){.activitySelectFilters{grid-template-columns:1fr}.activitySummary{gap:5px}.activitySummary article{padding:9px 7px}.activitySummary strong{font-size:10px}}\n"
              css.write_text(cs)
          PY
          npm install --no-audit --no-fund
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx src/spenza-layout.css
          git commit -m "Add transaction search filters and filtered totals"
          git push
