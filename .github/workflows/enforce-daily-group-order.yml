name: Enforce daily group transaction order
on:
  push:
    paths:
      - '.github/workflows/enforce-daily-group-order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort rows inside daily groups explicitly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="<h3>{d===today()?'Today':new Date(`${d}T00:00:00`).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</h3>{items.map(t=><TxRow t={t} key={t.id}/>)}"
          new="<h3>{d===today()?'Today':new Date(`${d}T00:00:00`).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</h3>{renderActivityRows(items)}"
          assert old in s, 'daily group row anchor missing'
          s=s.replace(old,new,1)
          assert 'newestTransactionFirst' in s
          assert 'renderActivityRows(items)' in s
          p.write_text(s)
          PY
          npm install --no-audit --no-fund
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Sort daily transaction groups newest first"
          git push
