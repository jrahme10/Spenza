name: Fix account delete flow
on:
  push:
    paths:
      - '.github/workflows/fix-account-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch account deletion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          start=s.index(" const deleteWallet=(id:string)=>")
          end=s.index(" const resetAll=", start)
          new=""" const deleteWallet=(id:string)=>{const wallet=data.wallets.find(w=>w.id===id);if(!wallet)return;const related=data.transactions.filter(t=>t.walletId===id||t.toWalletId===id);const relatedBills=(data.bills||[]).filter(b=>b.walletId===id);const count=related.length;const billCount=relatedBills.length;setDialog({title:`Delete ${wallet.name}?`,message:`This account${count?` and ${count} related transaction${count===1?'':'s'}`:''}${billCount?` and ${billCount} related bill${billCount===1?'':'s'}`:''} will be permanently deleted. This cannot be undone.`,kind:'danger',confirmLabel:'Delete account',onConfirm:async()=>{try{const next:SpenzaData={...data,wallets:data.wallets.filter(w=>w.id!==id),transactions:data.transactions.filter(t=>t.walletId!==id&&t.toWalletId!==id),bills:(data.bills||[]).filter(b=>b.walletId!==id)};await saveData(next);setData(next);if(activityWalletId===id)setActivityWalletId(null);if(insightWalletId===id)setInsightWalletId('');if(homeWalletId===id)setHomeWalletId('');if(walletId===id)setWalletId('');if(toWalletId===id)setToWalletId('');setDialog({title:'Account deleted',message:`${wallet.name} and its related data were removed from this device.`,kind:'info'})}catch{setDialog({title:'Could not delete account',message:'Spenza could not save the account deletion to local storage. Please try again.',kind:'info'})}}})}\n"""
          p.write_text(s[:start]+new+s[end:])
          PY
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Harden account deletion and local persistence"
          git push
