name: Harden wallet action layer
on:
  push:
    paths:
      - '.github/workflows/harden-wallet-actions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden wallet edit/delete tap layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/spenza-layout.css')
          s=p.read_text()
          marker='/* wallet-action-hard-fix */'
          if marker not in s:
              s += '''\n/* wallet-action-hard-fix */\n.refWalletGrid article{isolation:isolate!important}\n.refWalletGrid article::before,.refWalletGrid article::after{pointer-events:none!important;z-index:0!important}\n.refWalletGrid .walletCardTop{position:relative!important;z-index:50!important;pointer-events:auto!important}\n.refWalletGrid .walletActions{position:relative!important;z-index:60!important;pointer-events:auto!important;display:flex!important}\n.refWalletGrid .walletActions button,.refWalletGrid .walletEdit,.refWalletGrid .walletDelete{position:relative!important;z-index:70!important;pointer-events:auto!important;touch-action:manipulation!important;min-width:40px!important;min-height:40px!important}\n.refWalletGrid .walletActions button svg{pointer-events:none!important}\n'''
          p.write_text(s)
          PY
          npm ci
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/spenza-layout.css
          git commit -m "Harden wallet delete button tap layer"
          git push
