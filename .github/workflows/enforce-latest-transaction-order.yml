name: Enforce latest transaction order
on:
  push:
    paths:
      - '.github/workflows/enforce-latest-transaction-order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce newest-first ordering in every transaction view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()

          old=" const activityTransactions=(activityWalletId?data.transactions.filter(t=>t.walletId===activityWalletId||t.toWalletId===activityWalletId):data.transactions).filter(t=>(activityTypeFilter==='all'||t.type===activityTypeFilter)&&inActivityPeriod(t.date)).slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||'')))"
          new=" const newestTransactionFirst=(a:Transaction,b:Transaction)=>b.date.localeCompare(a.date)||String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||''))\n const activityTransactions=(activityWalletId?data.transactions.filter(t=>t.walletId===activityWalletId||t.toWalletId===activityWalletId):data.transactions).filter(t=>(activityTypeFilter==='all'||t.type===activityTypeFilter)&&inActivityPeriod(t.date)).slice().sort(newestTransactionFirst)"
          assert old in s, 'activity transaction sort anchor missing'
          s=s.replace(old,new,1)

          old=" const renderActivityRows=(items:Transaction[])=>items.map(t=><TxRow t={t} key={t.id}/>)"
          new=" const renderActivityRows=(items:Transaction[])=>items.slice().sort(newestTransactionFirst).map(t=><TxRow t={t} key={t.id}/>)"
          assert old in s, 'row renderer anchor missing'
          s=s.replace(old,new,1)

          old=" const renderMonthlyGroups=()=>Object.entries(activityMonthGroups).map(([month,items])=>"
          new=" const renderMonthlyGroups=()=>Object.entries(activityMonthGroups).sort(([a],[b])=>b.localeCompare(a)).map(([month,items])=>"
          assert old in s, 'monthly group order anchor missing'
          s=s.replace(old,new,1)

          old=" const renderYearlyGroups=()=>Object.entries(activityYearGroups).map(([year,months])=>"
          new=" const renderYearlyGroups=()=>Object.entries(activityYearGroups).sort(([a],[b])=>b.localeCompare(a)).map(([year,months])=>"
          assert old in s, 'yearly group order anchor missing'
          s=s.replace(old,new,1)

          old="<div>{Object.entries(months).map(([month,items])=>"
          new="<div>{Object.entries(months).sort(([a],[b])=>b.localeCompare(a)).map(([month,items])=>"
          assert old in s, 'nested month order anchor missing'
          s=s.replace(old,new,1)

          old="activityPeriod==='yearly'?renderYearlyGroups():Object.entries(activityGroups).map(([d,items])=>"
          new="activityPeriod==='yearly'?renderYearlyGroups():Object.entries(activityGroups).sort(([a],[b])=>b.localeCompare(a)).map(([d,items])=>"
          assert old in s, 'daily group order anchor missing'
          s=s.replace(old,new,1)

          # Sanity checks: explicit newest-first logic must exist at every level.
          assert 'sort(newestTransactionFirst)' in s
          assert "Object.entries(activityMonthGroups).sort(([a],[b])=>b.localeCompare(a))" in s
          assert "Object.entries(activityYearGroups).sort(([a],[b])=>b.localeCompare(a))" in s
          assert "Object.entries(months).sort(([a],[b])=>b.localeCompare(a))" in s
          assert "Object.entries(activityGroups).sort(([a],[b])=>b.localeCompare(a))" in s
          p.write_text(s)
          PY
          npm install --no-audit --no-fund
          npm run build
          git config user.name "Spenza Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git commit -m "Always show latest transactions first"
          git push
